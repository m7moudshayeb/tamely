# Every pull request must say what it proposes and what it delivers.
# Read-only: it never checks out or runs the pull request's code.
name: PR template
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - name: Check "What's proposed" and "What it delivers"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY") or "", flags=re.S)
          def section(title):
              m = re.search(rf"^##\s*{title}\s*$(.*?)(?=^##\s|\Z)", body, flags=re.M | re.S | re.I)
              return (m.group(1).strip() if m else None)
          missing = [t for t in ("What's proposed", "What it delivers") if not section(t)]
          if missing:
              print("Please fill in these sections of the pull request description: " + ", ".join(missing))
              sys.exit(1)
          print("Template filled in.")
          PY
